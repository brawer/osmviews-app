# SPDX-License-Identifier: MIT

version = 1

# The root LICENSE file duplicates LICENSES/MIT.txt so that GitHub, whose
# license detection is unreliable at finding LICENSES/, still recognises it.
[[annotations]]
path = "LICENSE"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"

# release-please's config and manifest are JSON, which cannot carry an SPDX
# header comment; the manifest is also rewritten by the bot on every release.
[[annotations]]
path = [
    "release-please-config.json",
    ".release-please-manifest.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"

# Frontend manifests: JSON and a bare version string, none of which can carry
# an SPDX header comment. package-lock.json is regenerated by npm. The
# bundled npm dependencies live under node_modules/, which is git-ignored and
# never distributed (the deploy workflow rebuilds it); their own licences
# travel with them there.
[[annotations]]
path = [
    "package.json",
    "package-lock.json",
    ".node-version",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"

# Adapted verbatim from the Contributor Covenant, version 3.0, which is
# stewarded by the Organization for Ethical Source and licensed CC-BY-SA-4.0.
# https://www.contributor-covenant.org/version/3/0/
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "The Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The Karla variable font, self-hosted (same font and license as
# brawer.ch's copy, fetched directly from Google Fonts for a wider weight
# range -- see theme.css's @font-face comment) rather than loaded
# cross-origin. karla-OFL.txt is the font's own bundled copy of the
# license text it's under, same content as LICENSES/OFL-1.1.txt.
[[annotations]]
path = [
    "public/fonts/karla-latin-variable.woff2",
    "public/fonts/karla-OFL.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 The Karla Project Authors (https://github.com/googlefonts/karla)"
SPDX-License-Identifier = "OFL-1.1"
