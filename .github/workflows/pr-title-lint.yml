#
# Enforces a Conventional Commits PR title. PRs are squash-merged with the PR
# title as the squash commit's title, and that's what release-please.yml reads
# to pick version bumps and CHANGELOG.md entries.
#
# pull_request_target (not pull_request) so this also runs for PRs from
# forks: it only reads the PR title from the base repo's workflow config, it
# doesn't need write access to or run any code from the fork.
#
# `synchronize` (a new commit pushed to the PR branch) is in the type list
# alongside `opened`/`edited`/`reopened`: without it, a PR that receives
# commits after opening never gets a fresh "Validate PR title" run against
# its new head SHA, so branch protection's required-status-check waits on it
# forever -- the title didn't change, but the required check is evaluated
# per commit, and this workflow just never reported anything for the new one.

name: Lint PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
